<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>報連相メモ｜5W1H</title>
<style>
:root{
--bg:#f4f6f5; --card:#ffffff; --ink:#22302a; --sub:#6b7a72;
--accent:#2e7d5b; --accent-dark:#256a4c; --line:#dde5e0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
background:var(--bg); color:var(--ink);
font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
padding:16px 14px 40px;
padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px; margin:0 auto;}
header{margin:6px 2px 14px;}
h1{font-size:22px; margin:0 0 4px; letter-spacing:.02em;}
header p{margin:0; color:var(--sub); font-size:13px; line-height:1.6;}
.card{
background:var(--card); border:1px solid var(--line); border-radius:14px;
padding:14px; margin-bottom:12px;
box-shadow:0 1px 3px rgba(30,50,40,.05);
}
label.title{
display:flex; align-items:center; gap:8px;
font-weight:700; font-size:15px; margin-bottom:8px;
}
.en{
display:inline-block; background:#eef4f0; color:var(--accent-dark);
font-size:12px; font-weight:700; border-radius:6px; padding:2px 8px; line-height:1.5;
}
.seg{display:flex; gap:8px;}
.seg button{
flex:1; padding:12px 6px; font-size:15px; font-weight:700;
background:#eef2ef; color:var(--ink); border:2px solid transparent; border-radius:10px;
appearance:none; -webkit-appearance:none; cursor:pointer; font-family:inherit;
}
.seg button.on{background:#fff; border-color:var(--accent); color:var(--accent-dark);}
input[type="text"], textarea{
width:100%; border:1px solid var(--line); border-radius:10px;
font-size:16px; /* 16px以上でiOS Safariの自動ズームを防ぐ */
padding:10px 12px; background:#fbfcfb; color:var(--ink);
font-family:inherit; line-height:1.6;
}
textarea{min-height:72px; resize:vertical;}
input[type="text"]:focus, textarea:focus{
outline:none; border-color:var(--accent); background:#fff;
box-shadow:0 0 0 3px rgba(46,125,91,.15);
}
.hint{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.6;}
.checks{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
.checks label{
display:inline-flex; align-items:center; gap:6px;
background:#eef2ef; border-radius:999px; padding:7px 12px;
font-size:14px; font-weight:700; cursor:pointer; user-select:none;
}
.checks input[type="checkbox"]{width:18px; height:18px; accent-color:var(--accent); margin:0;}
.checks label.off{opacity:.45;}
.polish-row{
display:flex; align-items:center; justify-content:space-between;
background:#f7faf8; border:1px solid var(--line); border-radius:10px;
padding:10px 12px; margin-bottom:12px;
}
.polish-row span{font-size:14px; font-weight:700;}
.polish-row small{display:block; font-weight:400; color:var(--sub); font-size:12px; margin-top:2px;}
.switch{position:relative; width:52px; height:30px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.slider{
position:absolute; inset:0; background:#cfd8d2; border-radius:999px; transition:.2s; cursor:pointer;
}
.slider:before{
content:""; position:absolute; width:24px; height:24px; left:3px; top:3px;
background:#fff; border-radius:50%; transition:.2s;
}
.switch input:checked +.slider{background:var(--accent);}
.switch input:checked +.slider:before{transform:translateX(22px);}
.preview{
white-space:pre-wrap; word-break:break-word;
background:#f7faf8; border:1px dashed var(--line); border-radius:10px;
padding:12px; font-size:15px; line-height:1.75; min-height:120px;
}
.preview.empty{color:var(--sub);}
.btns{display:flex; gap:10px; margin-top:12px;}
.btns button{
appearance:none; -webkit-appearance:none; border:none; cursor:pointer;
font-family:inherit; font-weight:700; border-radius:10px;
}
.btn-copy{flex:1; background:var(--accent); color:#fff; font-size:16px; padding:14px 10px;}
.btn-copy:active{background:var(--accent-dark);}
.btn-clear{background:#eef2ef; color:var(--ink); font-size:14px; padding:14px 16px;}
.toast{
position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom));
transform:translateX(-50%) translateY(20px);
background:#22302a; color:#fff; font-size:14px; font-weight:700;
padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
transition:opacity.25s, transform.25s; z-index:10;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
footer{color:var(--sub); font-size:12px; text-align:center; margin-top:18px; line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>報連相メモ｜5W1H</h1>
<p>5W1H（いつ・どこで・だれが・なにを・なぜ・どうやって）で書くと、抜けなく伝わります。各項目は箇条書きで書いてOK。まとめでつなげて文章にします。入力内容はこの端末にだけ自動保存されます。</p>
</header>

<div class="card">
<label class="title">区分</label>
<div class="seg" id="segType">
<button type="button" data-v="報告" class="on">報告</button>
<button type="button" data-v="連絡">連絡</button>
<button type="button" data-v="相談">相談</button>
</div>
</div>

<div class="card">
<label class="title" for="subject">件名（任意）</label>
<input type="text" id="subject" placeholder="例：〇〇の進捗について">
</div>

<div class="card">
<label class="title" for="when"><span class="en">When</span> いつ</label>
<input type="text" id="when" placeholder="例：昨日まで／明日10:00／今日中">
</div>

<div class="card">
<label class="title" for="where"><span class="en">Where</span> どこで</label>
<input type="text" id="where" placeholder="例：オンライン会議で／〇〇店で">
</div>

<div class="card">
<label class="title" for="who"><span class="en">Who</span> だれが・だれに</label>
<input type="text" id="who" placeholder="例：私が／〇〇さんへ">
</div>

<div class="card">
<label class="title" for="what"><span class="en">What</span> なにを</label>
<textarea id="what" placeholder="箇条書きでOK。例：・〇〇の作業が完了&#10;・検品も問題なし"></textarea>
</div>

<div class="card">
<label class="title" for="why"><span class="en">Why</span> なぜ</label>
<textarea id="why" placeholder="箇条書きでOK。例：・来週の締切に影響するため"></textarea>
</div>

<div class="card">
<label class="title" for="how"><span class="en">How</span> どうやって・どうなった</label>
<textarea id="how" placeholder="箇条書きでOK。例：・資料を添付して送ります&#10;・確認のうえ返信をお願いします"></textarea>
<div class="hint">結果や、次のお願い（いつまでに・何をしてほしいか）もここに。</div>
</div>

<div class="card">
<label class="title" for="memo">メモ（任意）</label>
<textarea id="memo" placeholder="補足があれば（箇条書きでもOK）"></textarea>
</div>

<div class="card">
<label class="title">まとめ（プレビュー）</label>
<div class="hint" style="margin:0 0 8px;">表示する項目を選べます（チェックを外した項目は、まとめとコピーから除かれます）。</div>
<div class="checks" id="checks">
<label><input type="checkbox" data-k="subject" checked>件名</label>
<label><input type="checkbox" data-k="when" checked>いつ</label>
<label><input type="checkbox" data-k="where" checked>どこで</label>
<label><input type="checkbox" data-k="who" checked>だれが</label>
<label><input type="checkbox" data-k="what" checked>なにを</label>
<label><input type="checkbox" data-k="why" checked>なぜ</label>
<label><input type="checkbox" data-k="how" checked>どうやって</label>
<label><input type="checkbox" data-k="memo" checked>メモ</label>
</div>
<label class="title" style="margin-top:4px;">まとめ形式</label>
<div class="seg" id="segMode" style="margin-bottom:12px;">
<button type="button" data-v="bun" class="on">文章（つなげる）</button>
<button type="button" data-v="list">箇条書き</button>
</div>
<div class="polish-row">
<span>文章を整える<small>適当な表現やカタコトでも、意味を推測して自然な文にします</small></span>
<label class="switch"><input type="checkbox" id="polishOn" checked><span class="slider"></span></label>
</div>
<div class="preview" id="preview"><span class="empty">入力すると、ここにコピー用の文章が表示されます。</span></div>
<div class="btns">
<button class="btn-copy" id="btnCopy" type="button">まとめてコピー</button>
<button class="btn-clear" id="btnClear" type="button">クリア</button>
</div>
</div>

<footer>報連相メモ｜入力内容は外部に送信されません</footer>
</div>
<div class="toast" id="toast">コピーしました</div>

<script>
(function(){
var ids = ['subject','when','where','who','what','why','how','memo'];
var fields = {};
ids.forEach(function(id){ fields[id] = document.getElementById(id);});
var preview = document.getElementById('preview');
var toast = document.getElementById('toast');
var seg = document.getElementById('segType');
var segMode = document.getElementById('segMode');
var checksBox = document.getElementById('checks');
var polishOn = document.getElementById('polishOn');
var type = '報告';
var mode = 'bun'; // bun=文章（つなげる） / list=箇条書き
var KEY = 'hourensou-memo-5w1h-v2';

var labels = { when:'いつ', where:'どこで', who:'だれが', what:'なにを', why:'なぜ', how:'どうやって'};
var order = ['when','where','who','what','why','how'];
var sentenceFields = { what:1, why:1, how:1, memo:1}; // 文として整える項目

function shown(k){
var cb = checksBox.querySelector('input[data-k="' + k + '"]');
return!cb || cb.checked;
}

// 箇条書きを綺麗な文に整える
function polish(text, asSentence){
var lines = String(text).split(/\n+/).map(function(s){
return s.replace(/^\s*[・•·●○◦\-\-‐―*＊※]\s*/, '')
.replace(/^\s*\d+\s*[.)、．]\s*/, '')
.trim();
}).filter(function(s){ return s.length > 0;});
if (!lines.length) return '';
var out = '';
lines.forEach(function(line, i){
if (i === 0) { out = line; return;}
if (/[。！？]$/.test(out)) { out += line;}
else { out += '、' + line;}
});
out = out.replace(/、+/g, '、').replace(/。+/g, '。').replace(/、$/,'').replace(/,$/,'').trim();
if (asSentence &&!/[。！？]$/.test(out)) out += '。';
return out;
}

// カタコト・適当な表現を標準の言葉に置き換える辞書
var KANA_DICT = [
['カイギシツ','会議室'],['ゲツヨウビ','月曜日'],['カヨウビ','火曜日'],['スイヨウビ','水曜日'],['モクヨウビ','木曜日'],['キンヨウビ','金曜日'],['ドヨウビ','土曜日'],['ニチヨウビ','日曜日'],
['スケジュール','予定'],['ミーティング','会議'],['キャクサキ','客先'],['コウジョウ','工場'],['ジムショ','事務所'],['ホンシャ','本社'],['ゲンバ','現場'],['テンポ','店舗'],['バショ','場所'],['ジカン','時間'],['ヨテイ','予定'],['モンダイ','問題'],
['アシタ','明日'],['アス','明日'],['キノウ','昨日'],['キョウ','今日'],['アサッテ','明後日'],['ライシュウ','来週'],['ライゲツ','来月'],['コンゲツ','今月'],['シュウマツ','週末'],['ゴゼン','午前'],['ゴゴ','午後'],
['ジョウシ','上司'],['ブチョウ','部長'],['カチョウ','課長'],['シャチョウ','社長'],['センパイ','先輩'],['ドウリョウ','同僚'],['センセイ','先生'],['ワタシ','私'],
['カイギ','会議'],['カクニン','確認'],['レンラク','連絡'],['ホウコク','報告'],['ソウダン','相談'],['シリョウ','資料'],['ジュンビ','準備'],['テイシュツ','提出'],['ヘンコウ','変更'],['チョウセイ','調整'],['タイオウ','対応'],['チョウサ','調査'],['ケントウ','検討'],['ジッシ','実施'],['サクセイ','作成'],['シュウセイ','修正'],['ソウフ','送付'],['キョウユウ','共有'],['イライ','依頼'],['ケッテイ','決定'],['エンキ','延期'],['チュウシ','中止'],['カイサイ','開催'],['サンカ','参加'],['ホウモン','訪問'],['セツメイ','説明'],['チェック','確認'],['オネガイ','お願い'],['ヤクソク','約束'],['ヒト','人'],['トコロ','場所']
];
var COLLOQ_DICT = [['とりあえず','まず'],['ちょっと','少し'],['やった','実施した'],['ダメ','不可'],['すみませんが','恐れ入りますが']];
function preNormalize(text){
var t = String(text);
if (/[　 ]/.test(t)) {
var toks = t.replace(/[　 ]+/g, ' ').split(' ').filter(function(s){ return s.length > 0;});
if (toks.length) t = toks.join('');
}
KANA_DICT.forEach(function(kv){ t = t.split(kv[0]).join(kv[1]); });
t = t.replace(/([一-龯])ノ([一-龯])/g, '$1の$2');
t = t.replace(/シマス/g, 'します').replace(/サレタ/g, 'された').replace(/シタ/g, 'した').replace(/スル/g, 'する');
COLLOQ_DICT.forEach(function(kv){ t = t.split(kv[0]).join(kv[1]); });
t = t.replace(/をみた/g, 'を確認した').replace(/^みた/, '確認した').replace(/、みた/g, '、確認した');
t = t.replace(/試みた/g, '').replace(/([一-龯])みた/g, '$1を確認した').replace(//g, '試みた');
return t;
}

function val(k){
var raw = fields[k].value;
if (!polishOn.checked) return raw.trim();
return polish(preNormalize(raw),!!sentenceFields[k]);
}
function phrase(k){ // 文末の。を外した形（つなげる用）
return val(k).replace(/[。]+$/,'').trim();
}

function buildList(){
var parts = [];
if (shown('subject')) {
var s = fields.subject.value.trim();
if (s) parts.push('件名：' + s);
}
var lines = [''];
order.forEach(function(k){
if (!shown(k)) return;
var v = val(k);
if (v) lines.push('・' + labels[k] + '：' + v);
});
if (lines.length > 1) parts.push(lines.join('\n'));
if (shown('memo')) {
var m = val('memo');
if (m) parts.push(m);
}
return parts.join('\n\n');
}

// ===== 文脈に合わせて自然につなげるための判定 =====
function isPolite(s){ return /(です|ます|でした|ました|ません|ください|でしょう)$/.test(s); }
function isVerbLike(s){ return isPolite(s) || /(た|だ|ない|る|う|く|ぐ|す|つ|ぬ|ぶ|む|れた|せた)$/.test(s); }
var STATE_END = /(済み|完了|対応中|進行中|作業中|調査中|確認中|中|未定|予定|見込み|見通し|状態|結果|以上)$/;
// 用言として締められる形に整える。名詞止め（体言止め）なら null を返す
function completePred(s){
if (!s) return null;
if (isVerbLike(s)) return s;
if (STATE_END.test(s)) return s + 'です';
if (/[しきぎちりにびみ]$/.test(s) && /[一-龯]$/.test(s.slice(0, -1)) && s.indexOf('、') < 0 && !/の[一-龯]+[しきぎちりにびみ]$/.test(s)) return s + 'ました';
return null;
}
function withParticleWhere(s){ return /(で|に|へ|から|まで)$/.test(s)? s: s + 'で'; }
function withParticleWho(s){ return (isVerbLike(s) || /(が|は|も)$/.test(s))? s: s + 'が'; }
// 「なぜ」を後ろの文につなげる形にする。つなげられない場合（丁寧な文など）は null
function whyConnector(s){
if (/(から|ので|ため|為)$/.test(s)) return s + '、';
if (isPolite(s)) return null;
if (/(た|だ|ない)$/.test(s)) return s + 'ため、';
if (/(依頼|要望|希望|指示|提案|指摘|相談|連絡|申し出)$/.test(s)) return s + 'があったため、';
return s + 'のため、';
}
// 単語から読み取るための辞書
var TROUBLE_WORDS = /(トラブル|問題|不具合|障害|遅延|遅れ|ミス|クレーム|故障)/;
var EVENT_WORDS = /(会議|打ち合わせ|ミーティング|面談|商談|訪問|出張|研修|説明会|発表会|会合)$/; // 末尾がイベント名詞のときだけ「を行いました」にする（「会議の日程」のような話題名詞を誤判定しない）
var MEANS_ONLY = /^(メール|電話|オンライン|対面|訪問|郵送|チャット|テレビ会議|Web会議|FAX|ファクス|LINE)$/;
// 「いつ」の単語から時制を読む（無ければ区分で判断）
function tenseOf(whenText){
if (/(明日|明後日|来週|来月|今後|次回|明朝)/.test(whenText)) return 'future';
if (/(昨日|一昨日|先日|今朝|先ほど|昨夜|本日)/.test(whenText)) return 'past';
return type === '連絡'? 'future': 'past';
}
// 「なにを」が名詞止めのとき、区分に合わせた締めの言葉（topic は「について」まで含む）
function typePredicate(){
return type === '相談'? '相談があります。': (type === '連絡'? '連絡します。': '報告します。');
}

function buildBun(){
var parts = [];
if (shown('subject')) {
var sb0 = fields.subject.value.trim();
if (sb0) parts.push('件名：' + sb0);
}
if (!polishOn.checked) { // 整えるOFFのときは単純につなげる
var bodyS = [];
var preS = [];
['when','where','who'].forEach(function(k){
if (!shown(k)) return;
var v = phrase(k);
if (v) preS.push(v);
});
var whatS = shown('what')? phrase('what'): '';
if (preS.length || whatS) {
var s1 = preS.join('、');
if (whatS) s1 = s1? s1 + '、' + whatS: whatS;
bodyS.push(s1 + '。');
}
var whyS = shown('why')? phrase('why'): '';
var howS = shown('how')? phrase('how'): '';
if (whyS && howS) bodyS.push(whyS + '、' + howS + '。');
else if (whyS) bodyS.push(whyS + '。');
else if (howS) bodyS.push(howS + '。');
if (bodyS.length) parts.push('\n' + bodyS.join(''));
if (shown('memo')) {
var mS = val('memo');
if (mS) parts.push(mS);
}
return parts.join('\n\n');
}
var rWhen = shown('when')? phrase('when'): '';
var rWhere = shown('where')? phrase('where'): '';
var rWho = shown('who')? phrase('who'): '';
var rWhat = shown('what')? phrase('what'): '';
var rWhy = shown('why')? phrase('why'): '';
var rHow = shown('how')? phrase('how'): '';
// 書く場所が違っていても、中身から本来の項目へ寄せる
var TIME_RE = /(昨日|一昨日|先日|今日|本日|明日|明後日|来週|来月|今週|午前|午後|今朝|先ほど|昨夜|週末|月曜|火曜|水曜|木曜|金曜|土曜|日曜)/;
var PLACE_RE = /(会議室|本社|支社|客先|工場|店舗|事務所|オンライン|現場|自宅|会場|ホール)/;
var PERSON_RE = /(さん|氏|様|課長|部長|係長|主任|社長|先生|私|自分|当方|全員|担当|チーム|メンバー|先方|相手)/;
if (rWhen && PLACE_RE.test(rWhen) && !TIME_RE.test(rWhen) && !rWhere) { rWhere = rWhen; rWhen = ''; }
if (rWhere && TIME_RE.test(rWhere) && !PLACE_RE.test(rWhere) && !rWhen) { rWhen = rWhere; rWhere = ''; }
if (rWho && (TIME_RE.test(rWho) || PLACE_RE.test(rWho)) && !PERSON_RE.test(rWho)) {
if (!rWhen && TIME_RE.test(rWho)) { rWhen = rWho; rWho = ''; }
else if (!rWhere && PLACE_RE.test(rWho)) { rWhere = rWho; rWho = ''; }
}
if (!rWhat && rWhy && !/(から|ので|ため|せい|おかげ)/.test(rWhy) && (isVerbLike(rWhy) || /を/.test(rWhy))) { rWhat = rWhy; rWhy = ''; }
if (!rWhy && rHow && /(から|ので|ため)$/.test(rHow)) { rWhy = rHow; rHow = ''; }
if (!rWhen && rWhat) {
var tm = rWhat.match(/^(昨日|一昨日|今日|本日|明日|明後日|来週|今週|午前中|午後|今朝|昨夜)[、\s]?/);
if (tm) { rWhen = tm[1]; rWhat = rWhat.slice(tm[0].length).replace(/^[はがも]/, ''); }
}
var pre = [];
if (rWhen) pre.push(rWhen);
if (rWhere) pre.push(withParticleWhere(rWhere));
if (rWho) pre.push(withParticleWho(rWho));
var preStr = pre.join('、');
var tense = tenseOf(rWhen || (rWhat + rHow)); // 時制は理由文（なぜ）の中の未来語には引っ張られない
var what = rWhat? rWhat.replace(/について$/, '').trim(): rWhat; // ユーザーが「〜について」と書いても二重にしない
var why = rWhy;
var how = rHow;
var sents = [];
var usedWhy = false, usedHow = false, preUsed = false;
function joinPre(main){ preUsed = true; return preStr? preStr + '、' + main: main; }
function howSentence(h){
var rp = repairNounChain(h);
if (rp) return rp;
var hc = completePred(h);
if (hc) {
if (tense === 'future' && /しました$/.test(hc)) hc = hc.replace(/しました$/, 'します');
return hc;
}
if (MEANS_ONLY.test(h)) return h + 'で対応' + (tense === 'future'? 'します': 'しました');
return h + (tense === 'future'? 'します': 'しました');
}
// 「資料確認」「資料の確認」のような名詞の並びを「資料を確認しました」に読み替える
// 動作名詞（サ変動詞化できる名詞）の辞書。話題名詞（日程・予算・進捗・結果・内容など）はここに含めず、「〜について」形にする
var ACTION_TAIL = /(確認|連絡|報告|相談|質問|回答|案内|作成|提出|修正|対応|準備|調査|検討|実施|手配|調整|送付|共有|依頼|決定|変更|延期|中止|開催|参加|訪問|説明|予約|発注|請求|受領|欠席|遅刻|早退|開始|終了|追加|削除)$/;
// 「を」ではなく「に」でつなぐのが自然な動作名詞
var NI_ACTION = {'対応':1, '参加':1, '回答':1, '相談':1, '遅刻':1, '早退':1};
function repairNounChain(s){
if (s.indexOf('、') >= 0 || s.indexOf('。') >= 0) return null;
var ending = (tense === 'future'? 'します': 'しました');
// 「確認作業」のような「動作名詞＋作業」は、全体を目的語にして「を行いました」にする
if (/作業$/.test(s)) {
var base = s.slice(0, s.length - 2);
if (base && ACTION_TAIL.test(base)) return s + (tense === 'future'? 'を行います': 'を行いました');
return null;
}
var m = s.match(ACTION_TAIL);
if (!m) return null;
var act = m[0];
var head = s.slice(0, s.length - act.length);
if (!head) return act + ending; // 動作名詞だけのとき（「確認」→「確認しました」）
var p = NI_ACTION[act]? 'に': 'を';
if (/への$/.test(head)) return head.slice(0, head.length - 2) + 'に' + act + ending; // 「部長への相談」→「部長に相談しました」
if (/の$/.test(head)) return head.slice(0, head.length - 1) + p + act + ending; // 「資料の確認」→「資料を確認しました」
if (/(を|に|へ|が|は|も|で|から|まで|再)$/.test(head)) return null;
return head + p + act + ending; // 「資料確認」→「資料を確認しました」／「会議参加」→「会議に参加しました」
}
// 「なにを」の単語から本分の締めを読む。読めなければ null（「について」形にする）
function whatMain(w){
var c = completePred(w);
if (c) return c;
if (/の?件$/.test(w)) return null; // 「〜の件」は「について」形にする
if (type !== '相談') { var rp2 = repairNounChain(w); if (rp2) return rp2; }
if (TROUBLE_WORDS.test(w)) {
if (/発生$/.test(w)) return w + 'しました';
if (/(遅延|遅れ)$/.test(w)) return w + 'がありました';
return w + (tense === 'future'? 'が発生する見込みです': 'が発生しました');
}
if (EVENT_WORDS.test(w)) return w + (tense === 'future'? 'を行います': 'を行いました');
return null;
}
if (what) {
var wc = whatMain(what);
if (wc) {
sents.push(joinPre(wc) + '。');
} else {
var topic = joinPre(what + 'について');
if (how) {
if (why) {
var yc0 = whyConnector(why);
if (yc0) { sents.push(topic + '、' + yc0 + howSentence(how) + '。'); usedWhy = true; }
else { sents.push(why + '。'); sents.push(topic + '、' + howSentence(how) + '。'); usedWhy = true; }
} else {
sents.push(topic + '、' + howSentence(how) + '。');
}
usedHow = true;
} else {
sents.push(topic + typePredicate());
}
}
}
if (why && !usedWhy) {
if (how && !usedHow) {
var yc2 = whyConnector(why);
if (yc2) { sents.push(yc2 + howSentence(how) + '。'); }
else { sents.push(why + '。'); sents.push(howSentence(how) + '。'); }
usedWhy = true; usedHow = true;
} else {
var whyBare = why.replace(/(から|ので)$/, '');
if (/(ため|為)$/.test(whyBare)) { sents.push(whyBare + '。'); } // 「〜ため」に「のためです」を重ねない
else if (/(依頼|要望|希望|指示|提案|指摘|相談|連絡|申し出)$/.test(whyBare) && !isPolite(whyBare)) { sents.push(whyBare + 'があったためです。'); }
else if (/(た|だ|ない)$/.test(whyBare)) { sents.push(whyBare + 'ためです。'); }
else { var wc2 = completePred(whyBare); sents.push((wc2? wc2: whyBare + 'のためです') + '。'); }
usedWhy = true;
}
} else if (how && !usedHow) {
sents.push(howSentence(how) + '。');
usedHow = true;
}
if (preStr && !preUsed && sents.length) {
sents[0] = preStr + '、' + sents[0];
preUsed = true;
}
if (!sents.length && preStr) sents.push(preStr + '。');
if (sents.length) parts.push('\n' + sents.map(politeEnd).join(''));
if (shown('memo')) {
var m = val('memo');
if (m) parts.push(m);
}
return parts.join('\n\n');
}

// 文末の言い方を丁寧な形にそろえる（した→しました、だ→です、など）
function politeEnd(sent){
var core = sent.replace(/。$/, '');
if (isPolite(core) || /(です|ます)$/.test(core)) return sent;
if (/なかった$/.test(core) || /かった$/.test(core)) return core + 'です。';
var rules = [
[/だった$/, 'でした'],
[/(飛|遊|呼|学|並|喜)んだ$/, '$1びました'],
[/んだ$/, 'みました'],
[/った$/, 'いました'],
[/いた$/, 'きました'],
[/いだ$/, 'ぎました'],
[/た$/, 'ました'],
[/じゃない$/, 'ではありません'],
[/ない$/, 'ません'],
[/する$/, 'します'],
[/くる$/, 'きます'],
[/だ$/, 'です']
];
for (var i = 0; i < rules.length; i++) {
if (rules[i][0].test(core)) { core = core.replace(rules[i][0], rules[i][1]); break; }
}
return core + '。';
}

function buildText(){ return mode === 'bun'? buildBun(): buildList();}

function render(){
var t = buildText();
if (t) { preview.textContent = t;}
else { preview.innerHTML = '<span class="empty">入力すると、ここにコピー用の文章が表示されます。</span>';}
var cbs = checksBox.querySelectorAll('label');
for (var i = 0; i < cbs.length; i++) {
var input = cbs[i].querySelector('input');
cbs[i].classList.toggle('off',!input.checked);
}
try {
var data = { type: type, mode: mode, polish: polishOn.checked, show: {}};
ids.forEach(function(id){ data[id] = fields[id].value;});
ids.forEach(function(id){ data.show[id] = shown(id);});
localStorage.setItem(KEY, JSON.stringify(data));
} catch(e) {}
}

function setType(v){
type = v;
var btns = seg.querySelectorAll('button');
for (var i = 0; i < btns.length; i++) {
btns[i].classList.toggle('on', btns[i].getAttribute('data-v') === v);
}
render();
}
function setMode(v){
mode = v;
var btns = segMode.querySelectorAll('button');
for (var i = 0; i < btns.length; i++) {
btns[i].classList.toggle('on', btns[i].getAttribute('data-v') === v);
}
render();
}

seg.addEventListener('click', function(e){
var b = e.target.closest('button');
if (b) setType(b.getAttribute('data-v'));
});
segMode.addEventListener('click', function(e){
var b = e.target.closest('button');
if (b) setMode(b.getAttribute('data-v'));
});
checksBox.addEventListener('change', render);
polishOn.addEventListener('change', render);

function showToast(msg){
toast.textContent = msg;
toast.classList.add('show');
setTimeout(function(){ toast.classList.remove('show');}, 1800);
}

function copyText(t){
if (navigator.clipboard && window.isSecureContext) {
return navigator.clipboard.writeText(t);
}
return new Promise(function(resolve, reject){
var ta = document.createElement('textarea');
ta.value = t;
ta.style.position = 'fixed'; ta.style.opacity = '0';
document.body.appendChild(ta);
ta.focus(); ta.select();
try {
var ok = document.execCommand('copy');
document.body.removeChild(ta);
ok? resolve(): reject(new Error('copy failed'));
} catch(e) {
document.body.removeChild(ta);
reject(e);
}
});
}

document.getElementById('btnCopy').addEventListener('click', function(){
var t = buildText();
if (!t) { showToast('まず入力してください'); return;}
copyText(t).then(function(){ showToast('コピーしました');})
.catch(function(){ showToast('コピーできませんでした');});
});

document.getElementById('btnClear').addEventListener('click', function(){
ids.forEach(function(id){ fields[id].value = '';});
render(); showToast('クリアしました');
});

ids.forEach(function(id){
fields[id].addEventListener('input', render);
});

try {
var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
if (saved) {
ids.forEach(function(id){ fields[id].value = saved[id] || '';});
if (saved.show) {
ids.forEach(function(id){
var cb = checksBox.querySelector('input[data-k="' + id + '"]');
if (cb && typeof saved.show[id] === 'boolean') cb.checked = saved.show[id];
});
}
if (typeof saved.polish === 'boolean') polishOn.checked = saved.polish;
if (saved.type) setType(saved.type);
if (saved.mode) setMode(saved.mode);
}
} catch(e) {}
render();
})();
</script>
</body>
</html>
